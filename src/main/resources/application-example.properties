# =============================================
# ClawBot 配置模板
# 复制此文件为 application.properties 并填入真实值
# =============================================

spring.application.name=mission

# Weather API (心知天气)
# 注册: https://www.seniverse.com/
weather.api.key=YOUR_SENIVERSE_API_KEY

# 高德地图 API (周边搜索)
# 注册: https://lbs.amap.com/
amap.api.key=YOUR_AMAP_API_KEY

# DeepSeek Chat API
# 注册: https://platform.deepseek.com/
deepseek.api.key=YOUR_DEEPSEEK_API_KEY
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.model=deepseek-chat

# Spring AI (使用 OpenAI 兼容配置连接 DeepSeek)
spring.ai.openai.api-key=${deepseek.api.key}
spring.ai.openai.base-url=${deepseek.api.base-url}
spring.ai.openai.chat.options.model=${deepseek.api.model}

# Vision API (DashScope / 阿里云通义千问多模态)
# 注册: https://dashscope.aliyun.com/
vision.api.key=YOUR_DASHSCOPE_API_KEY
vision.api.base-url=https://dashscope.aliyuncs.com/compatible-mode
vision.api.model=qwen3.7-plus

# Speech - TTS (文字转语音，复用 vision.api.key)
speech.tts.model=qwen3-tts-flash
speech.tts.voice=Cherry

# SILK 解码器路径（微信语音 SILK→PCM）
# 下载: https://github.com/kn007/silk-v3-decoder
silk.decoder.path=E:/Program Files/silk_v3_decoder.exe

# Image Generation API (智谱 CogView-3-Plus)
# 注册: https://open.bigmodel.cn/
image.gen.api.key=YOUR_ZHIPU_API_KEY
image.gen.api.base-url=https://open.bigmodel.cn/api/paas/v4
image.gen.api.model=cogview-3-plus
image.gen.api.endpoint=/images/generations

# 腾讯招聘 (自动投简历模块)
resume.platform.provider=tencent
resume.platform.base-url=https://careers.tencent.com
resume.platform.default-city=深圳
resume.platform.min-match-score=60
resume.platform.max-apply-count=10
resume.platform.min-apply-interval=2
resume.platform.max-apply-interval=5

# SQLite 数据库
spring.datasource.url=jdbc:sqlite:clawbot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

