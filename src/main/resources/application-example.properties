# =============================================
# ClawBot configuration template
# Copy this file to application.properties and fill in real values.
# =============================================

spring.application.name=mission

# Tavily Search API
# Sign up: https://tavily.com/
tavily.api.key=YOUR_TAVILY_API_KEY

# Weather API (Seniverse)
# Sign up: https://www.seniverse.com/
weather.api.key=YOUR_SENIVERSE_API_KEY

# AMap API (nearby search / route planning)
# Sign up: https://lbs.amap.com/
amap.api.key=YOUR_AMAP_API_KEY

# DeepSeek Chat API
# Sign up: https://platform.deepseek.com/
deepseek.api.key=YOUR_DEEPSEEK_API_KEY
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.model=deepseek-v4-flash

# Spring AI - OpenAI Chat (DeepSeek)
spring.ai.openai.api-key=${deepseek.api.key}
spring.ai.openai.base-url=${deepseek.api.base-url}
spring.ai.openai.chat.options.model=${deepseek.api.model}

# Vision API (DashScope / Alibaba Qwen multimodal)
# Sign up: https://dashscope.aliyun.com/
vision.api.key=YOUR_DASHSCOPE_API_KEY
vision.api.base-url=https://dashscope.aliyuncs.com/compatible-mode
vision.api.model=qwen3.7-plus

# Speech - TTS (text to speech, reuses vision.api.key)
speech.tts.model=qwen3-tts-flash
speech.tts.voice=Cherry
# ASR model (speech to text)
speech.asr.model=qwen3-asr-flash

# SILK decoder path (WeChat voice SILK -> PCM)
# Download: https://github.com/kn007/silk-v3-decoder
silk.decoder.path=C:/path/to/silk_v3_decoder.exe

# Image Generation API (Zhipu CogView-3-Plus)
# Sign up: https://open.bigmodel.cn/
image.gen.api.key=YOUR_ZHIPU_API_KEY
image.gen.api.base-url=https://open.bigmodel.cn/api/paas/v4
image.gen.api.model=cogview-3-plus
image.gen.api.endpoint=/images/generations

# =============================================
# Resume platform config
# =============================================
# provider: liepin (real search + apply via MCP/COOKIE), mock (dev test)
resume.platform.provider=liepin
resume.platform.base-url=https://api-c.liepin.com
# Liepin JWT token (MCP API authentication)
resume.platform.liepin-token=YOUR_LIEPIN_JWT_TOKEN
# Liepin cookie (web API authentication, optional)
# resume.platform.liepin-cookie=YOUR_LIEPIN_COOKIE
resume.platform.default-city=Hangzhou
resume.platform.min-match-score=50
resume.platform.max-apply-count=10
resume.platform.min-apply-interval=2
resume.platform.max-apply-interval=5

# SQLite database
spring.datasource.url=jdbc:sqlite:clawbot.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Embedding (DashScope text vectorization)
embedding.api.key=YOUR_DASHSCOPE_API_KEY
embedding.api.base-url=https://dashscope.aliyuncs.com/compatible-mode
embedding.api.model=text-embedding-v3

# RAG knowledge base
rag.top-k=5
rag.similarity-threshold=0.7
rag.vectors-file=knowledge-vectors.json

# Redis long-term memory
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.timeout=3000ms

# Memory config
clawbot.memory.short-term-size=20
clawbot.memory.long-term-threshold=30
clawbot.memory.ttl-days=7
